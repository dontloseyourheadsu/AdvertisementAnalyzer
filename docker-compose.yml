services:
  fsharp-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - dataset-volume:/app/dataset
      - ./output:/app/output
      - ./data/billboard_best.onnx:/app/billboard_best.onnx:ro
    environment:
      - ROBOFLOW_API_KEY=${ROBOFLOW_API_KEY}
      - KAGGLE_API_TOKEN=${KAGGLE_API_TOKEN}
      - VLM_SERVICE_URL=http://vlm-service:5000/refine
      - OLLAMA_URL=http://ollama:11434/api/generate
    command: ["run", "--dataset", "/app/dataset", "--output", "/app/output", "--yolo-weights", "/app/billboard_best.onnx", "--detect", "--lang", "es"]
    depends_on:
      - vlm-service
      - ollama

  vlm-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "src/vlm_service.py"]
    ports:
      - "5000:5000"

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  dataset-volume:
  ollama-data:


